name: Backend verification

on:
  pull_request:
  push:
    branches: [main, codex/backend-reliability-supabase]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: eduskills_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pip install ruff==0.17.1
      - name: Static checks
        working-directory: backend
        run: ruff check app tests migrations tools
      - name: SQLite regression suite
        working-directory: backend
        run: python -m pytest -q
      - name: PostgreSQL regression and concurrency suite
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:local-ci-only@localhost:5432/eduskills_test
          TEST_DATABASE_SCHEMA: test_eduskills
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npm run build
